<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | IoT Platform</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>🚀 Create Account</h1>

            <p class="auth-subtitle">
                Join the IoT Platform and manage your devices.
            </p>


            <!-- FLASH MESSAGES -->

            {% with messages = get_flashed_messages() %}

                {% if messages %}

                    {% for message in messages %}

                        <div class="flash-message">

                            {{ message }}

                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <form method="POST">

                <label>
                    <strong>Username</strong>
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required
                >


                <label>
                    <strong>Email</strong>
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label>
                    <strong>Password</strong>
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >


                <button type="submit">
                    Create Account →
                </button>

            </form>


            <p class="auth-footer">

                Already have an account?

                <a href="{{ url_for('login') }}">
                    Login
                </a>

            </p>


            <br>

            <a href="{{ url_for('home') }}">
                ← Back to Home
            </a>

        </div>

    </div>

</body>

</html>
